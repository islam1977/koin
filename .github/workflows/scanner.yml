name: Binance Early-Pump Scanner V2

on:
  schedule:
    # أقل فاصل تسمح به GitHub هو 5 دقائق، وممكن يتأخر شوية وقت الزحام.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # للتشغيل اليدوي من تبويب Actions

permissions:
  contents: write   # عشان الـ job يحفظ ملفات الحالة والنتائج في الريبو

concurrency:
  group: binance-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one scan cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python binance_early_pump_v2.py --once

      - name: Save state and results back to the repo
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add scanner_state.json early_pump_signal_results.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update scanner state [skip ci]"
          git push || true
